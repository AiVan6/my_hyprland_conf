general {
    fractional_scaling = 1
}

monitor {
    output = HDMI-A-1
    position = auto
    mirror = eDP-1
}

background {
    monitor = 
    path = /home/ivan/.config/hypr/wallprapers/marine-tunnel.jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    monitor = eDP-1
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.33
    dots_spacing = 0.15
    fade_on_empty = false

#    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
#    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color= rgba(0, 0, 0, 0) rgba(ff0066ee) 40deg
#    outline_thickness = 

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor = 
    text = $TIME
    color = rgba(255, 255, 255, 0.6)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    rounding = 15

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%d %B %Y"
    color = rgba(255, 255, 255, 0.6)
    font_size = 15
    font_family = JetBrainsMono Nerd Font


    position = 0, 0
    halign = center
    valign = top
}

label {
    monitor =
    text = $LAYOUT[en,ru]
    color = rgba(255, 255, 255, 0.6)
    font_size = 10
    font_family = JetBrainsMono Nerd Font

    position = -10, 0
    halign = right
    valign = top
}
